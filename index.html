<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#3a7d44" />
  <meta name="description" content="Find lækre afgrøder, friske æg, jordbær, honning og gårdlækkerier nær sommerhuset i Vejby." />

  <title>Gårdsalg · friske afgrøder nær sommerhuset</title>

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Gårdsalg" />

  <!-- Leaflet (kort) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="app-header__bar">
      <h1 class="brand"><span class="brand__emoji" aria-hidden="true">🌾</span> Gårdsalg</h1>
      <button id="locBtn" class="loc-btn" type="button" title="Beregn afstande fra min position">
        <span class="loc-btn__icon" aria-hidden="true">📍</span>
        <span class="loc-btn__label">Min position</span>
      </button>
    </div>
    <p class="tagline" id="tagline">Lækre afgrøder &amp; gårdlækkerier nær sommerhuset</p>
    <p class="home-note" id="homeNote"></p>
  </header>

  <div class="controls">
    <div class="search">
      <span class="search__icon" aria-hidden="true">🔎</span>
      <input id="search" type="search" placeholder="Søg efter sted eller vare (fx jordbær, æg)…"
             autocomplete="off" aria-label="Søg" />
      <button id="searchClear" class="search__clear" type="button" aria-label="Ryd søgning" hidden>✕</button>
    </div>

    <div class="chips" id="catChips" role="group" aria-label="Filtrér på varegrupper"></div>

    <div class="toolbar">
      <div class="result-count" id="resultCount"></div>
      <div class="toolbar__right">
        <label class="toggle">
          <input type="checkbox" id="openNowToggle" />
          <span>Åben nu</span>
        </label>
        <button id="mapToggle" class="ghost-btn" type="button" aria-expanded="true">Skjul kort</button>
      </div>
    </div>
  </div>

  <div id="mapWrap" class="map-wrap">
    <div id="map" aria-label="Kort over salgssteder"></div>
  </div>

  <main id="list" class="cards" aria-live="polite"></main>

  <footer class="app-footer">
    <p class="app-footer__count" id="footerCount"></p>
    <p>Fundet et nyt sted? 🌱 Se <code>data/README.md</code> for hvordan det tilføjes.</p>
    <p class="app-footer__credit">Kortdata © OpenStreetMap-bidragydere · Lavet til turen til Vejby</p>
  </footer>

  <!-- Detalje-ark (bottom sheet) -->
  <div id="sheetOverlay" class="sheet-overlay" hidden></div>
  <section id="sheet" class="sheet" aria-modal="true" role="dialog" aria-label="Detaljer om salgssted" hidden>
    <div class="sheet__grab" id="sheetGrab"></div>
    <button id="sheetClose" class="sheet__close" type="button" aria-label="Luk">✕</button>
    <div id="sheetBody" class="sheet__body"></div>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/app.js" defer></script>
</body>
</html>
